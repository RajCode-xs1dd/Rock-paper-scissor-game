<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rock Paper Scissors - A Modern Hand Clash Battle</title>
    <meta name="description" content="Play a modern, responsive Rock Paper Scissors game featuring premium 3D neumorphic layouts, vivid active violet glowing feedback systems, and dynamic dark mode options.">
    <meta name="keywords" content="Rock Paper Scissors, hand clash game, rps game, online game, casual game, 3D web game, RajCode">
    <meta name="author" content="RajCode">

    <!-- Open Graph / Facebook Social Sharing Cards -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Rock Paper Scissors - A Modern Hand Clash Battle">
    <meta property="og:description" content="Choose your move. Experience smooth hand-shake animations and premium 3D design components.">
    <meta property="og:image" content="https://github.io">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://github.io">
    <meta property="og:site_name" content="Rock Paper Scissors">

    <!-- Twitter/X Social Sharing Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Rock Paper Scissors - A Modern Hand Clash Battle">
    <meta name="twitter:description" content="Choose your move. Experience smooth hand-shake animations and premium 3D design components.">
    <meta name="twitter:image" content="https://github.io">
    <meta name="twitter:site" content="@RajeshPatraCS">

    <!-- iOS Native App Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RPS Game">

    <!-- Icons and Fonts System Setup -->
    <link rel="icon" type="image/svg+xml" href="game-icon.svg">
    <link rel="apple-touch-icon" href="game-icon.svg">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glow-overlay" id="glow"></div>
<button class="theme-toggle" onclick="toggleTheme()" id="theme-icon">🌙</button>

<div class="game-card">
    <div class="score-bar">
        <div>
            <div class="btn-text">PLAYER</div>
            <div id="p-score" class="score-val">0</div>
        </div>
        <div>
            <div class="btn-text">CPU</div>
            <div id="c-score" class="score-val">0</div>
        </div>
    </div>

    <div class="arena">
        <div id="p-hand" class="hand-icon">✊</div>
        <div class="vs-divider" id="vs-text">VS</div>
        <div id="c-hand" class="hand-icon">✊</div>
    </div>

    <div id="status" class="msg-area">CHOOSE YOUR WEAPON</div>

    <div class="btn-group">
        <button class="control-btn" onclick="playGame('rock')">
            <span class="btn-emoji">✊</span><span class="btn-text">ROCK</span>
        </button>
        <button class="control-btn" onclick="playGame('paper')">
            <span class="btn-emoji">✋</span><span class="btn-text">PAPER</span>
        </button>
        <button class="control-btn" onclick="playGame('scissors')">
            <span class="btn-emoji">✌️</span><span class="btn-text">SCISSORS</span>
        </button>
    </div>
</div>

<button class="reset-btn" onclick="resetGame()">RESET SCORE</button>

<script src="script.js"></script>
</body>
</html>
